# Independent Ponytail experiment. Other UNITRAN configs are not modified.
paths:
  coco_root: data/mscoco14
  # Change this directory when changing the split seed or sample size.
  work_dir: feature/unpaired_mpnet/mscoco14_seed42_n10000
  result_dir: outputs/unpaired_mpnet/mscoco14_seed42_n10000

split:
  seed: 42
  # One side gets 5000 images; the other side gets 5000 disjoint images.
  # Set null to use every train2014 image (~41,391 / ~41,392 per side).
  train_size_per_side: 5000
  # Independently sampled, still truly paired val2014 image/caption records.
  # Set null to evaluate all 40504 val2014 images.
  val_size: 1000

vision:
  model: dinov2_vitb14_reg
  image_size: 448
  pooling: patch_mean  # alternatively all_token_mean
  batch_size: 8
  num_workers: 4

text:
  model: sentence-transformers/all-mpnet-base-v2
  image_batch_size: 64
  text_batch_size: 128

runtime:
  device: cuda

# Original UNITRAN mini_vec2vec algorithm. These values match train_mapping.yaml.
mapping:
  seed: 0
  num_anchor_runs: 30
  num_clusters: 20
  qap_runs: 30
  anchor_subsample: 10000
  initial_k: 50
  refine_iters: 100
  refine_sample: 10000
  refine_k: 50
  refine2_clusters: 500
  alpha: 0.5
  # Only changes matrix materialization; not the algorithm or objective.
  similarity_batch_size: 512
  # The original mini_vec2vec performs similarity calculations on CPU.
  similarity_device: cpu

evaluation:
  batch_size: 128
  device: cpu
