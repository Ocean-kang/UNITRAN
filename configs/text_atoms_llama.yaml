experiment:
  name: text_atoms_llama_k20
  output_dir: outputs/text_atoms_llama_k20

data:
  limit: 0

text:
  sample_jsonl: outputs/local_density_n1000_k20/sample_1000.jsonl
  out_jsonl: outputs/text_atoms_llama_k20/text_atoms.jsonl
  max_atoms: 20
  num_atoms: 20

llm:
  # HuggingFace-format Llama3 weights, e.g. directory containing config.json/tokenizer.json/*.safetensors.
  backend: hf
  ckpt_dir: ./Meta-Llama-3-8B-Instruct-HF
  tokenizer_path: null
  max_seq_len: 2048
  max_batch_size: 4
  max_gen_len: 512
  temperature: 0.2
  top_p: 0.9
  torch_dtype: bf16
  device_map: auto
  local_files_only: true
  trust_remote_code: false

runtime:
  resume: true
