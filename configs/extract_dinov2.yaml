active_dataset: mscoco14

datasets:
  mscoco14:
    coco_root: data/mscoco14
    split: train2014
    output_dir: feature/vision/coco2014_dinov2_vitb14_reg_448
  mscoco17:
    coco_root: data/mscoco17
    split: train2017
    output_dir: feature/vision/coco2017_dinov2_vitb14_reg_448

experiment:
  name: extract_dinov2_vitb14_reg_448
  seed: 0

data:
  ann_path: null
  image_dir: null
  max_images: null

vision:
  model: dinov2_vitb14_reg
  image_size: 448
  patch_size: 14
  save_dtype: float16
  amp_dtype: float16
  save_image_mean_pt: true
  normalize_image_mean: true
  write_global_meta: true
  # 新增
  save_disentangled_self_attn: true
  save_self_attn_maps: true
  save_cls_token: true

runtime:
  batch_size: 32
  num_workers: 8
  shard_id: 0
  num_shards: 1
  shard_strategy: contiguous
  device: cuda
  overwrite: false
