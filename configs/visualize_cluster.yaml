active_dataset: mscoco14

datasets:
  mscoco14:
    feature_dir: feature/vision/coco2014_dinov2_vitb14_reg_448
    image_root: data/mscoco14/train2014
    output_dir: outputs/visualize/coco2014_cluster_extremes_k1024
  mscoco17:
    feature_dir: feature/vision/coco2017_dinov2_vitb14_reg_448
    image_root: data/mscoco17/train2017
    output_dir: outputs/visualize/coco2017_cluster_extremes_k1024

experiment:
  name: visualize_cluster_extremes_k1024

visualization:
  mode: cluster_extremes   # cluster_topk | cluster_extremes | image_cls_attention | image_local_centers | embedding_2d
  clusters: 0-9            # all, single id, comma list, or range
  topk: 20
  metric: cosine
  tile_size: 224
  collage_cols: 5
  overlay_alpha: 0.45
  save_each: false

cluster:
  k: 1024
  centroids: null
  cluster_ids: null
  cluster_dist: null

runtime:
  chunk_images: 1024
