# Deprecated: use configs/eval_prototypes.yaml --set active_dataset=mscoco14 instead.
experiment:
  name: eval_prototypes_mscoco14_val2014
  seed: 0
  output_dir: feature/eval/mscoco2014

data:
  coco_root: data/mscoco14
  split: val2014
  annotation_type: auto
  ann_path: null
  image_dir: data/mscoco14/val2014
  mask_dir: null
  max_images: null

vision:
  model: dinov2_vitb14
  image_size: 448
  patch_size: 14
  mask_to_patch: majority
  normalize_prototypes: true

text:
  embedding_model: sentence-transformers/all-mpnet-base-v2
  batch_size: 128

prototype:
  out_dir: feature/eval/mscoco2014
  out_name: mscoco2014_eval_prototypes.pt
  min_patch_count: 1

runtime:
  batch_size: 16
  num_workers: 4
  device: cuda
  amp_dtype: float16
  overwrite: false
