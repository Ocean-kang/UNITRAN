# Deprecated: use configs/extract_dinov2.yaml --set active_dataset=mscoco17 instead.
experiment:
  name: extract_dinov2_vitb14_reg_448_mscoco17
  seed: 0
  output_dir: feature/vision/coco2017_dinov2_vitb14_reg_448

data:
  coco_root: data/mscoco17
  split: train2017
  ann_path: null
  image_dir: null
  max_images: null

vision:
  model: dinov2_vitb14
  image_size: 448
  patch_size: 14
  save_dtype: float16
  amp_dtype: float16
  save_image_mean_pt: true
  normalize_image_mean: true
  write_global_meta: true

runtime:
  batch_size: 32
  num_workers: 8
  shard_id: 0
  num_shards: 1
  shard_strategy: contiguous
  device: cuda
  overwrite: false
